<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="simongame.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="box">
        <button id="box1" style="background-color: green;"></button>
        <button id="box2" style="background-color: orange;"></button>
        <button id="box3" style="background-color: yellow;"></button>
        <button id="box4" style="background-color: red;"></button>
    </div>
    <script src="simongame.js"></script>
</body>
</html>
